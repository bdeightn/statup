{# hx-sync drops a second click while a test runs, as on the monitoring
   fields. The result lands in #destination-test-result, inside the form. #}
<button type="button" class="btn btn-ghost check-test" hx-post="/admin/notifications/test" hx-target="#destination-test-result" hx-swap="innerHTML" hx-sync="this:drop"><span class="check-test-idle">{{ i18n.t("notifications.test") }}</span><span class="check-test-busy">{{ i18n.t("notifications.testing") }}</span></button>
